<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, follow" />
  <title>Page introuvable — Mrauto Canada</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Barlow', sans-serif;
      background: #f5f7fb;
      color: #1a1a2e;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      text-align: center;
    }
    .logo {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 800;
      font-size: 22px;
      letter-spacing: 0.08em;
      color: #1a3a6e;
      text-decoration: none;
      text-transform: uppercase;
      margin-bottom: 48px;
    }
    .code {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 120px;
      font-weight: 800;
      color: #1a3a6e;
      line-height: 1;
      margin-bottom: 16px;
    }
    h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #1a1a2e;
    }
    p {
      font-size: 16px;
      color: #555;
      max-width: 400px;
      line-height: 1.6;
      margin-bottom: 40px;
    }
    .actions {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      display: inline-block;
      padding: 14px 28px;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 0.05em;
      text-decoration: none;
      text-transform: uppercase;
    }
    .btn-primary { background: #1a3a6e; color: #fff; }
    .btn-primary:hover { background: #0f2347; }
    .btn-outline { border: 2px solid #1a3a6e; color: #1a3a6e; }
    .btn-outline:hover { background: #1a3a6e; color: #fff; }
  </style>
</head>
<body>
  <a class="logo" href="/">MRAUTO Canada</a>
  <div class="code">404</div>
  <h1>Page introuvable</h1>
  <p>Cette page n'existe pas ou a été déplacée. Consultez notre catalogue ou retournez à l'accueil.</p>
  <div class="actions">
    <a class="btn btn-primary" href="/catalogue">Voir le catalogue</a>
    <a class="btn btn-outline" href="/">Accueil</a>
  </div>
</body>
</html>
