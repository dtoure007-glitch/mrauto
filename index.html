// ── SUPABASE ───────────────────────────────────────────────────────────────
const { createClient } = window.supabase;
const sb = createClient(
  'https://tunszuazffcniyaylxwj.supabase.co',
  'sb_publishable_ORGOouzE5_jT5BCgqWLhKQ_Z3XnrPW7'
);

function useCars() {
  const [cars, setCars] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  React.useEffect(() => {
    sb.from('cars')
      .select('*')
      .eq('status', 'available')
      .order('created_at', { ascending: false })
      .then(({ data, error }) => {
        if (!error && data) setCars(data);
        setLoading(false);
      });
  }, []);
  return { cars, loading };
}

function useFeatured() {
  const [featured, setFeatured] = React.useState(null);
  React.useEffect(() => {
    sb.from('cars').select('*').eq('featured', true).eq('status', 'available').limit(1)
      .then(({ data }) => { if (data && data.length > 0) setFeatured(data[0]); });
  }, []);
  return featured;
}


function useSoldCars() {
  const [soldCars, setSoldCars] = React.useState([]);
  React.useEffect(() => {
    sb.from('cars').select('*').eq('status', 'sold')
      .order('created_at', { ascending: false })
      .then(({ data }) => { if (data) setSoldCars(data); });
  }, []);
  return soldCars;
}


// ── HERO CAROUSEL ─────────────────────────────────────────────────────────
function HeroCarousel({ photos, alt }) {
  const [idx, setIdx] = React.useState(0);
  const [prev, setPrev] = React.useState(null);

  React.useEffect(() => {
    if (photos.length <= 1) return;
    const t = setInterval(() => {
      setIdx(i => {
        setPrev(i);
        return (i + 1) % photos.length;
      });
    }, 5000);
    return () => clearInterval(t);
  }, [photos.length]);

  const goTo = (i) => {
    setPrev(idx);
    setIdx(i);
  };

  return (
    <React.Fragment>
      {photos.map((src, i) => (
        <img
          key={src + i}
          src={src}
          alt={alt}
          style={{
            position: 'absolute', inset: 0, width: '100%', height: '100%',
            objectFit: 'cover', display: 'block',
            opacity: i === idx ? 1 : 0,
            transition: 'opacity 0.9s ease-in-out',
            zIndex: i === idx ? 1 : 0,
          }}
        />
      ))}
      {photos.length > 1 && (
        <div style={{
          position: 'absolute', bottom: 16, left: 0, right: 0,
          display: 'flex', justifyContent: 'center', gap: 6, zIndex: 4,
        }}>
          {photos.map((_, i) => (
            <button
              key={i}
              onClick={() => goTo(i)}
              aria-label={`Photo ${i + 1}`}
              style={{
                width: i === idx ? 22 : 8, height: 8,
                borderRadius: 0, border: 'none', padding: 0, cursor: 'pointer',
                background: i === idx ? 'var(--accent)' : 'rgba(255,255,255,0.55)',
                boxShadow: '0 1px 4px rgba(0,0,0,0.35)',
                transition: 'width 0.35s ease, background 0.35s ease',
              }}
            />
          ))}
        </div>
      )}
    </React.Fragment>
  );
}

  return (

      <div style={{ position: 'relative', display: 'flex', flexDirection: 'column', justifyContent: 'center', padding: isMobile ? '80px 24px 48px' : '80px 64px 80px 68px', background: 'var(--bg)', borderRight: isMobile ? 'none' : '1px solid var(--border)' }}>

        {photos.length > 0
          ? <HeroCarousel photos={photos} alt={altText} />

// ── STATS (fond sombre intentionnel — contraste fort) ─────────────────────
function StatItem({ num, label, index }) {
  const [ref, visible] = useScrollReveal();
  const m = num.match(/^(\d+)(.*)/);
  const target = m ? parseInt(m[1]) : 0;
  const suffix = m ? m[2] : '';
  const count = useCounter(target, 1400, visible);
  return (
    <div ref={ref} style={{
      padding: '52px 40px', textAlign: 'center',
      borderRight: index < 2 ? '1px solid rgba(255,255,255,0.08)' : 'none',
      opacity: visible ? 1 : 0,
      transform: visible ? 'none' : 'translateY(20px)',
      transition: `opacity 0.6s ease ${index * 200}ms, transform 0.6s ease ${index * 200}ms`,
    }}>
      <div style={{ fontFamily: 'var(--font-display)', fontSize: 80, fontWeight: 900, color: 'var(--accent-on-dark)', lineHeight: 1, letterSpacing: '-0.02em', textTransform: 'uppercase' }}>
        {count}{suffix}
      </div>
      <div style={{ fontFamily: 'var(--font-body)', fontSize: 13, color: 'rgba(255,255,255,0.42)', marginTop: 10, letterSpacing: '0.06em', textTransform: 'uppercase' }}>{label}</div>
    </div>
  );
}

function StatsSection() {

}

// ── APP ────────────────────────────────────────────────────────────────────
function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const featuredCar = useFeatured();

  React.useEffect(() => {
    const handleNav = (e) => {
      const a = e.target.closest('a[href]');
      if (!a) return;
      const href = a.getAttribute('href');
      if (!href || href.startsWith('#') || href.startsWith('http') || href.startsWith('//') || href.startsWith('tel:') || href.startsWith('mailto:')) return;
      e.preventDefault();
      const root = document.getElementById('root');
      root.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
      root.style.opacity = '0';
      root.style.transform = 'translateY(-8px)';
      setTimeout(() => { window.location.href = href; }, 300);
    };
    document.addEventListener('click', handleNav);
    return () => document.removeEventListener('click', handleNav);
  }, []);

  React.useEffect(() => {
    const r = document.documentElement;
    const themes = {
      'blanc-rouge': {
        '--bg': '#ffffff', '--bg-alt': '#f5f5f5', '--card-bg': '#ffffff',
        '--text': '#111111', '--text-muted': 'rgba(17,17,17,0.48)',
        '--accent': '#E2001A', '--accent-on-dark': '#ff4d4d', '--accent-pale': 'rgba(226,0,26,0.07)',
        '--border': 'rgba(17,17,17,0.1)', '--chip-bg': 'rgba(17,17,17,0.05)',
        '--nav-bg': 'rgba(255,255,255,0.97)'
      },
      'noir-rouge': {
        '--bg': '#0e0e0e', '--bg-alt': '#191919', '--card-bg': '#1c1c1c',
        '--text': '#f0f0f0', '--text-muted': 'rgba(240,240,240,0.45)',
        '--accent': '#E2001A', '--accent-on-dark': '#ff4d4d', '--accent-pale': 'rgba(226,0,26,0.12)',
        '--border': 'rgba(255,255,255,0.08)', '--chip-bg': 'rgba(255,255,255,0.06)',
        '--nav-bg': 'rgba(14,14,14,0.97)'
      },
      'anthracite-rouge': {
        '--bg': '#1a1a1a', '--bg-alt': '#242424', '--card-bg': '#222222',
        '--text': '#e8e8e8', '--text-muted': 'rgba(232,232,232,0.45)',
        '--accent': '#E2001A', '--accent-on-dark': '#ff4d4d', '--accent-pale': 'rgba(226,0,26,0.12)',
        '--border': 'rgba(255,255,255,0.09)', '--chip-bg': 'rgba(255,255,255,0.06)',
        '--nav-bg': 'rgba(26,26,26,0.97)'
      }
    };
    const t = themes[tweaks.theme] || themes['blanc-rouge'];
    Object.entries(t).forEach(([k, v]) => r.style.setProperty(k, v));
  }, [tweaks.theme]);

  return (
    <React.Fragment>
          <HifiNav />
          <HeroSection heroLayout={tweaks.heroLayout} featuredCar={featuredCar} />
          <StatsSection />
          <CatalogueSection />
          <DemarcheSection />
          <SocialProofSection />
          <CtaPushSection />
          <ContactSection />
          <HifiFooter />
          <TweaksPanel>
            <TweakSection title="Palette">
              <TweakRadio id="theme" label="Couleur" value={tweaks.theme} onChange={(v) => setTweak('theme', v)}
          options={[
          { label: 'Blanc & Rouge', value: 'blanc-rouge' },
          { label: 'Noir & Rouge', value: 'noir-rouge' },
          { label: 'Anthracite & Rouge', value: 'anthracite-rouge' }]
          } />
            </TweakSection>
            <TweakSection title="Hero">
              <TweakRadio id="heroLayout" label="Layout" value={tweaks.heroLayout} onChange={(v) => setTweak('heroLayout', v)}
          options={[{ label: 'Split', value: 'split' }, { label: 'Plein cadre', value: 'fullbleed' }]} />
            </TweakSection>
          </TweaksPanel>
        </React.Fragment>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
