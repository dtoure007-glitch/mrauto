<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Wireframes — Site vitrine voitures Dakar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; }
    body { font-family: 'Patrick Hand', sans-serif; background: #f0eee9; }
    * { box-sizing: border-box; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="wireframe-kit.jsx"></script>
  <script type="text/babel" src="wf-a.jsx"></script>
  <script type="text/babel" src="wf-b.jsx"></script>
  <script type="text/babel" src="wf-c.jsx"></script>
  <script type="text/babel" src="wf-d.jsx"></script>
  <script type="text/babel" src="wf-e.jsx"></script>

  <script type="text/babel">
    const ARTBOARD_W = 1180;
    const ARTBOARD_H = 2800;

    function App() {
      return (
        <DesignCanvas>
          <DCSection id="retained" title="Direction retenue · v1" subtitle="Hero + Catalogue (A, sans filtres) · Démarche (D) · Social proof (C) · CTA confiance renforcé">
            <DCArtboard id="e" label="E · Mix retenu" width={1180} height={3200}>
              <WfE />
            </DCArtboard>
            <DCPostIt top={-40} left={-220} rotate={-3} width={210}>
              Mix de tes choix.\nValide ou ajuste avant qu'on passe en hi-fi.
            </DCPostIt>
          </DCSection>
          <DCSection id="desktop" title="Explorations initiales · 4 directions" subtitle="références — clique pour voir en plein écran · ←/→ pour naviguer">
            <DCArtboard id="a" label="A · Catalogue Classique" width={ARTBOARD_W} height={ARTBOARD_H}>
              <WfA />
            </DCArtboard>
            <DCArtboard id="b" label="B · Magazine Premium" width={ARTBOARD_W} height={3050}>
              <WfB />
            </DCArtboard>
            <DCArtboard id="c" label="C · Story Scroll" width={ARTBOARD_W} height={2900}>
              <WfC />
            </DCArtboard>
            <DCArtboard id="d" label="D · WhatsApp First" width={ARTBOARD_W} height={2750}>
              <WfD />
            </DCArtboard>
            <DCPostIt top={-40} left={-220} rotate={-3} width={200}>
              4 directions pour explorer.<br/>
              Dis-moi laquelle t'attire le plus → on raffine.
            </DCPostIt>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
