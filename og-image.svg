<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E2001A"/>
      <stop offset="100%" stop-color="#ff2d20"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Red accent bar left -->
  <rect x="0" y="0" width="8" height="630" fill="url(#accent)"/>

  <!-- Grid lines (subtle) -->
  <line x1="0" y1="315" x2="1200" y2="315" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Red corner accent -->
  <polygon points="1200,0 1080,0 1200,120" fill="url(#accent)" opacity="0.6"/>

  <!-- Logo circle placeholder -->
  <circle cx="96" cy="96" r="44" fill="#E2001A" opacity="0.15"/>
  <text x="96" y="104" text-anchor="middle" font-family="Arial Black, Arial" font-weight="900" font-size="20" fill="#E2001A">MR</text>

  <!-- Tag line -->
  <text x="72" y="210" font-family="Arial, sans-serif" font-weight="700" font-size="13" letter-spacing="4" fill="#E2001A" text-transform="uppercase">CONCESSIONNAIRE · DAKAR · SÉNÉGAL</text>

  <!-- Main headline -->
  <text x="72" y="310" font-family="Arial Black, Arial" font-weight="900" font-size="86" fill="#ffffff" letter-spacing="-2">MRAUTO</text>
  <text x="72" y="400" font-family="Arial Black, Arial" font-weight="900" font-size="86" fill="#ffffff" letter-spacing="-2">CANADA</text>

  <!-- Sub headline -->
  <text x="72" y="460" font-family="Arial, sans-serif" font-weight="400" font-size="22" fill="rgba(255,255,255,0.5)">Voitures d'occasion importées • Papiers vérifiés • Livraison à domicile</text>

  <!-- Bottom bar -->
  <rect x="0" y="580" width="1200" height="50" fill="url(#accent)" opacity="0.12"/>
  <text x="72" y="611" font-family="Arial, sans-serif" font-weight="600" font-size="15" fill="rgba(255,255,255,0.6)">www.mrautocanada.com</text>
  <text x="1128" y="611" text-anchor="end" font-family="Arial, sans-serif" font-weight="600" font-size="15" fill="rgba(255,255,255,0.6)">+221 77 834 64 64</text>
</svg>
